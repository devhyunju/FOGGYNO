<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> FOGGYNO </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <div class="header-date">
                <p>날짜</p>
                <p id="today-date"></p>
            </div>
            <div class="header-logo">
                <img src="foggyno-logo.png" alt="foggyno 로고">
            </div>
            <div class="header-setting">
                <span>✳️ 설정 ✳️</span>
            </div>
        </header>
    <main>
        <div class="input-row">
            <button id="cloud-btn">☁️</button>
            <input type="text" id="todo-input" placeholder="딴 생각은 ☁️아이콘, 할 일은 ➕아이콘을 누르세요">
            <button id="add-btn">➕</button>
            
        </div>
        <div class="sort-row">
            <select id="sort-select">
                <option value="priority">우선순위순</option>
                <option value="date">기한순</option>
            </select>
        </div>

        
        
        <ul class="todo-list">
            
            
            
        </ul>
        <div class="completed-section">
                <h3>✅ 완료한 일</h3>
                <ul class="completed-list"></ul>
            </div>
    </main>
   
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2>할 일 추가</h2>
        <div class="modal-field">
            <label>제목</label>
            <input type="text" id="modal-title" placeholder="할 일 제목">
        </div>
        <div class="modal-field">
            <label>기한</label>
            <input type="date" id="modal-date">
        </div>
        <div class="modal-field">
            <label>우선순위</label>
            <select id="modal-priority">
                <option value="1">1 - 높음 </option>
                <option value="2">2 - 중간 </option>
                <option value="3">3 - 낮음</option>
            </select>
        </div>

        <div class="modal-field">
            <label>상세 내용</label>
            <textarea id="modal-detail" placeholder="상세 내용을 입력하세요"></textarea>
        </div>
        <div class="modal-buttons">
            <button id="modal-cancel">취소</button>
            <button id="modal-save">저장</button>
        </div>
        </div>
    </div>

    <div class="modal-overlay" id="timer-modal">
        <div class="modal-box timer-box">
            <h2>🕒 뽀모도로</h2>
            <p id="timer-title">중요 프로젝트 마감</p>
            <div id="timer-display">25:00</div>
            <div class="timer-buttons">
                <button id="timer-start">▶ 시작</button>
                <button id="timer-cancel">✕ 닫기</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="cloud-modal">
        <div class="modal-box">
             <h2>☁️ 딴생각 창고</h2>
             <div class="modal-field">
                <textarea id="cloud-input"></textarea>
             </div>
             <div class="modal-field">
                <ul class="cloud-list"></ul>
             </div>
              <div class="modal-buttons">
                <button id="cloud-cancel">취소</button>
                <button id="cloud-save">저장</button>
            </div>
        </div>      
    </div>
       
    <script src="app.js"></script>
    </body>
</html>
